
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorá las 30 franquicias de la NBA, su historia, jugadores y estadísticas.">
    <title>NBA Teams 2026</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <h1>🏀 NBA TEAMS 2026</h1>
        <p>Conocé las 30 franquicias de la mejor liga de básquet del mundo</p>
    </header>

    <main class="container">
        <section class="teams-section">
            <h2 class="conference-title east-title">Conferencia Este</h2>
            <div class="teams-grid" id="eastTeams"></div>

            <h2 class="conference-title west-title">Conferencia Oeste</h2>
            <div class="teams-grid" id="westTeams"></div>
        </section>
    </main>

    <!-- Ficha del equipo -->
    <div class="modal" id="teamModal" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" id="closeModal" aria-label="Cerrar">&times;</button>

            <div id="teamDetails">
                <!-- El contenido se genera desde JavaScript -->
            </div>
        </div>
    </div>

    <footer>
        <p>NBA Teams 2026 | Proyecto informativo no oficial</p>
    </footer>
</body>
</html>
