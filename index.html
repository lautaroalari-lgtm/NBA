<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos NBA 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f5f5f5;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 30px;
        }

        .grid-equipos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            flex: 2;
        }

        .card-equipo {
            background-color: #162447;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .card-equipo:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.1);
        }

        /* Representación visual estilizada del Logo */
        .logo-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .nombre-equipo {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Panel de Información Lateral */
        .panel-info {
            flex: 1;
            background-color: #1f4068;
            border-radius: 15px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #e43f5a;
        }

        .panel-info h2 {
            margin-top: 0;
            color: #e43f5a;
            border-bottom: 2px solid #e43f5a;
            padding-bottom: 10px;
        }

        .dato-item {
            margin: 15px 0;
            font-size: 1.05rem;
        }

        .dato-item strong {
            color: #00bbf9;
        }

        .instruccion {
            color: #a0a0a0;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🏀 Franquicias NBA Temporada 2026</h1>

    <div class="container">
        <!-- Grilla de equipos -->
        <div class="grid-equipos" id="gridEquipos"></div>

        <!-- Ficha de detalles -->
        <div class="panel-info" id="panelInfo">
            <p class="instruccion">Haz clic en el logo de cualquier equipo para ver sus detalles de la temporada 2026.</p>
        </div>
    </div>

    <script>
        // Datos oficiales y proyectados para la temporada 2026
        const equiposNBA = [
            { id: "bos", nombre: "Boston Celtics", siglas: "BOS", color: "#007A33", conferencia: "Este", division: "Atlántico", estrella: "Jayson Tatum", titulos: 18, arena: "TD Garden" },
            { id: "lal", nombre: "Los Angeles Lakers", siglas: "LAL", color: "#552583", conferencia: "Oeste", division: "Pacífico", estrella: "Anthony Davis", titulos: 17, arena: "Crypto.com Arena" },
            { id: "gsw", nombre: "Golden State Warriors", siglas: "GSW", color: "#1D428A", conferencia: "Oeste", division: "Pacífico", estrella: "Stephen Curry", titulos: 7, arena: "Chase Center" },
            { id: "mil", nombre: "Milwaukee Bucks", siglas: "MIL", color: "#00471B", conferencia: "Este", division: "Central", estrella: "Giannis Antetokounmpo", titulos: 2, arena: "Fiserv Forum" },
            { id: "nyk", nombre: "New York Knicks", siglas: "NYK", color: "#006BB6", conferencia: "Este", division: "Atlántico", estrella: "Jalen Brunson", titulos: 2, arena: "Madison Square Garden" },
            { id: "mia", nombre: "Miami Heat", siglas: "MIA", color: "#98002E", conferencia: "Este", division: "Sureste", estrella: "Bam Adebayo", titulos: 3, arena: "Kaseya Center" },
            { id: "phx", nombre: "Phoenix Suns", siglas: "PHX", color: "#E56020", conferencia: "Oeste", division: "Pacífico", estrella: "Devin Booker", titulos: 0, arena: "Footprint Center" },
            { id: "dal", nombre: "Dallas Mavericks", siglas: "DAL", color: "#00538C", conferencia: "Oeste", division: "Suroeste", estrella: "Luka Dončić", titulos: 1, arena: "American Airlines Center" },
            { id: "den", nombre: "Denver Nuggets", siglas: "DEN", color: "#0E2240", conferencia: "Oeste", division: "Noroeste", estrella: "Nikola Jokić", titulos: 1, arena: "Ball Arena" },
            { id: "phi", nombre: "Philadelphia 76ers", siglas: "PHI", color: "#006BB6", conferencia: "Este", division: "Atlántico", estrella: "Joel Embiid", titulos: 3, arena: "Wells Fargo Center" },
            { id: "okc", nombre: "Oklahoma City Thunder", siglas: "OKC", color: "#007AC1", conferencia: "Oeste", division: "Noroeste", estrella: "Shai Gilgeous-Alexander", titulos: 1, arena: "Paycom Center" },
            { id: "min", nombre: "Minnesota Timberwolves", siglas: "MIN", color: "#0C2340", conferencia: "Oeste", division: "Noroeste", estrella: "Anthony Edwards", titulos: 0, arena: "Target Center" },
            { id: "sas", nombre: "San Antonio Spurs", siglas: "SAS", color: "#8A8D8F", conferencia: "Oeste", division: "Suroeste", estrella: "Victor Wembanyama", titulos: 5, arena: "Frost Bank Center" },
            { id: "ind", nombre: "Indiana Pacers", siglas: "IND", color: "#FDBB30", conferencia: "Este", division: "Central", estrella: "Tyrese Haliburton", titulos: 0, arena: "Gainbridge Fieldhouse" },
            { id: "cle", nombre: "Cleveland Cavaliers", siglas: "CLE", color: "#860038", conferencia: "Este", division: "Central", estrella: "Donovan Mitchell", titulos: 1, arena: "Rocket Mortgage FieldHouse" }
        ];

        const gridEquipos = document.getElementById('gridEquipos');
        const panelInfo = document.getElementById('panelInfo');

        // Generar las tarjetas de los equipos de forma dinámica
        equiposNBA.forEach(equipo => {
            const card = document.createElement('div');
            card.className = 'card-equipo';
            card.onclick = () => mostrarDetalles(equipo);

            card.innerHTML = `
                <div class="logo-placeholder" style="background-color: ${equipo.color};">
                    ${equipo.siglas}
                </div>
                <div class="nombre-equipo">${equipo.nombre}</div>
            `;
            gridEquipos.appendChild(card);
        });

        // Función para cambiar los datos del panel lateral
        function mostrarDetalles(equipo) {
            panelInfo.innerHTML = `
                <h2>${equipo.nombre}</h2>
                <div class="dato-item"><strong>Conferencia:</strong> ${equipo.conferencia}</div>
                <div class="dato-item"><strong>División:</strong> ${equipo.division}</div>
                <div class="dato-item"><strong>Estrella Principal:</strong> ${equipo.estrella}</div>
                <div class="dato-item"><strong>Estadio:</strong> ${equipo.arena}</div>
                <div class="dato-item"><strong>Campeonatos NBA:</strong> ${equipo.titulos}</div>
                <div class="logo-placeholder" style="background-color: ${equipo.color}; width: 100px; height: 100px; font-size: 2rem; margin-top: 20px;">
                    ${equipo.siglas}
                </div>
            `;
        }
    </script>
</body>
</html>
